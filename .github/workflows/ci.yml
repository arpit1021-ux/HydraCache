name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run tests with race detector
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Enforce coverage gate
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          # 55% is a regression floor set from the actual measured baseline
          # (59.1% at the time this gate was added), with a few points of
          # slack for normal fluctuation — not an aspirational target. It
          # exists to catch a future change that quietly drops coverage a
          # lot, not to imply every package individually clears 55%: cmd/cli
          # sits at ~7% and several cmd/* packages have no tests at all
          # (see the Test job's own per-package output above this step).
          awk -v cov="$COVERAGE" 'BEGIN { exit (cov+0 < 55.0) ? 1 : 0 }' \
            || { echo "Coverage ${COVERAGE}% is below the 55% regression floor"; exit 1; }
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build server
        run: go build -o bin/hydracache ./cmd/server
      - name: Build CLI
        run: go build -o bin/hc ./cmd/cli
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t hydracache:latest .
      - name: Test Docker image
        run: |
          docker run -d --name test-node -p 7379:7379 hydracache:latest
          sleep 3
          docker exec test-node wget -q --spider http://localhost:8379/health
          docker stop test-node
          docker rm test-node

  reference-app:
    name: Reference App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: golangci-lint (examples/readthrough)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          working-directory: examples/readthrough
      - name: Build and test
        working-directory: examples/readthrough
        run: |
          go build ./...
          go vet ./...
          go test -race ./...
