# 5-node HydraCache cluster. Pod 0 is always the bootstrap seed the other
# four join — see the command block below — which only works safely because
# StatefulSets default to podManagementPolicy: OrderedReady, guaranteeing
# hydracache-0 passes its readiness probe before hydracache-1 is even
# created, hydracache-1 before hydracache-2, and so on. Do not set
# podManagementPolicy: Parallel here without also changing the join logic —
# parallel pod creation would let a later pod try to join a seed that isn't
# up yet.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hydracache
  namespace: hydracache
  labels:
    app.kubernetes.io/name: hydracache
spec:
  serviceName: hydracache-headless
  replicas: 5
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: hydracache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hydracache
    spec:
      # Spreads replicas across different nodes on a best-effort basis so a
      # single Kubernetes node failure doesn't take out more than one
      # HydraCache pod. "preferred," not "required" — a cluster smaller than
      # 5 worker nodes can still schedule all pods rather than being stuck
      # Pending, at the cost of losing that spread guarantee.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: hydracache
                topologyKey: kubernetes.io/hostname
      securityContext:
        # Matches the Dockerfile's pinned hydracache UID/GID (1000) exactly
        # — fsGroup is what makes the mounted PersistentVolume actually
        # writable by that non-root user; the image's own build-time chown
        # only affects the image layer, not a volume mounted over it at
        # runtime.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      containers:
        - name: hydracache
          image: hydracache:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              SEED="hydracache-0.hydracache-headless.$POD_NAMESPACE.svc.cluster.local:7379"
              ADVERTISE="$POD_NAME.hydracache-headless.$POD_NAMESPACE.svc.cluster.local:7379"
              JOIN_ARGS=""
              if [ "$POD_NAME" != "hydracache-0" ]; then
                JOIN_ARGS="-join $SEED"
              fi
              exec /app/hydracache \
                -config /etc/hydracache/config.yaml \
                -addr :7379 \
                -http :8379 \
                -data-dir /data/wal \
                -id "$POD_NAME" \
                -advertise "$ADVERTISE" \
                $JOIN_ARGS
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: resp
              containerPort: 7379
            - name: http
              containerPort: 8379
          # Deliberately not startupProbe-gated on cluster convergence — a
          # pod's own /health only reflects its own TCP server being up
          # (see cmd/server/main.go's handler), not "has finished joining
          # the cluster." That distinction is intentional: readiness should
          # reflect whether this pod is a safe place to route client
          # traffic, not gossip convergence, which can legitimately take
          # longer than a reasonable readiness window.
          readinessProbe:
            httpGet:
              path: /health
              port: 8379
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8379
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/hydracache
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: hydracache-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
